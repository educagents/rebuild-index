name: Monthly re-run

# The 26th of every month, 06:00 UTC. Also runnable by hand from the
# Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "0 6 26 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-run the searches
        run: node rebuild-index.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh the README table
        run: node render-readme.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rebuild-index.json README.md
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Monthly re-run: $(node -p "require('./data/rebuild-index.json').retrieved")"
            git push
          fi
